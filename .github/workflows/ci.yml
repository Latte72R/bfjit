name: Benchmark

on:
  push:
    paths:
      - 'src/**'
      - 'benchmark/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'src/**'
      - 'benchmark/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget make

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22

          sudo apt-get update

          wget https://github.com/sharkdp/hyperfine/releases/download/v1.20.0/hyperfine_1.20.0_amd64.deb
          sudo dpkg -i hyperfine_1.20.0_amd64.deb

      - name: Select LLVM 22
        run: |
          echo "CC=clang-22" >> "$GITHUB_ENV"
          echo "CXX=clang++-22" >> "$GITHUB_ENV"
          echo "AR=llvm-ar-22" >> "$GITHUB_ENV"
          echo "NM=llvm-nm-22" >> "$GITHUB_ENV"
          echo "RANLIB=llvm-ranlib-22" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

      - name: Verify LLVM 22
        run: |
          clang-22 --version
          llvm-config-22 --version

      - name: Build
        run: |
          git clone --depth 1 https://github.com/rdebath/Brainfuck.git /tmp/Brainfuck
          make -C /tmp/Brainfuck/extras hydrogen8
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBFJIT_HYDROGEN_SOURCE_DIR=/tmp/Brainfuck/extras
          cmake --build build

      - name: Run benchmarks
        run: |
          set -euo pipefail

          result_file="$(mktemp)"
          block_file="$(mktemp)"
          tmp_readme="$(mktemp)"
          trap 'rm -f "$result_file" "$block_file" "$tmp_readme"' EXIT

          hyperfine -w 1 -r 10 -N \
            -L case mandelbrot_x2,hanoi_x2 \
            "./build/bfjit ./build/benchmark_cases/{case}.bf" \
            "/tmp/Brainfuck/extras/hydrogen8 ./build/benchmark_cases/{case}.bf" \
            | tee "$result_file"

          {
            printf '```text\n'
            cat "$result_file"
            printf '```\n'
          } > "$block_file"

          sed '/<!-- benchmark:start -->/,/<!-- benchmark:end -->/{//!d;}' README.md \
            | sed "/<!-- benchmark:start -->/r $block_file" \
            > "$tmp_readme"

          mv "$tmp_readme" README.md

      - name: Commit and push README update
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          if git diff --quiet -- README.md; then
            echo "README.md is unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "update benchmark results"
          git push
